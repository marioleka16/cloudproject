name: Deploy to 2 EC2 Instances as root

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key for EC2 1
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY_1 }}" > ~/.ssh/id_ed25519_1
        chmod 600 ~/.ssh/id_ed25519_1
        ssh-keyscan -H ${{ secrets.EC2_HOST_1 }} >> ~/.ssh/known_hosts

    - name: Deploy and restart on EC2 1 as root
      run: |
        rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519_1 -o StrictHostKeyChecking=no" ./ root@${{ secrets.EC2_HOST_1 }}:cloudproject/
        ssh -i ~/.ssh/id_ed25519_1 root@${{ secrets.EC2_HOST_1 }} << 'EOF'
          cd cloudproject
          npm install
          npm run build
          pm2 restart cloudproject || pm2 start npm --name "cloudproject" -- start
          pm2 save
        EOF

    - name: Setup SSH key for EC2 2
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY_2 }}" > ~/.ssh/id_ed25519_2
        chmod 600 ~/.ssh/id_ed25519_2
        ssh-keyscan -H ${{ secrets.EC2_HOST_2 }} >> ~/.ssh/known_hosts

    - name: Deploy and restart on EC2 2 as root
      run: |
        rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519_2 -o StrictHostKeyChecking=no" ./ root@${{ secrets.EC2_HOST_2 }}:cloudproject/
        ssh -i ~/.ssh/id_ed25519_2 root@${{ secrets.EC2_HOST_2 }} << 'EOF'
          cd cloudproject
          npm install
          npm run build
          pm2 restart cloudproject || pm2 start npm --name "cloudproject" -- start
          pm2 save
        EOF
